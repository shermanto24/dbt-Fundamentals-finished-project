version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        columns:
          - name: id
            tests:
              - unique:
                  config:
                    severity: error
                    warn_if: ">10"
                    error_if: ">100"
          - name: paymentmethod
            tests:
              - not_null:
                  config:
                    where: "status = 'success'"
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ['success', 'fail']
                    config: 
                      limit: 10
                      store_failures: true
            
        # loaded_at_field: _batched_at
        # freshness:
        #   warn_after: {count: 12, period: hour}
        #   error_after: {count: 24, period: hour}