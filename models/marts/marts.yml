version: 2

models:
  - name: dim_customers
    description: customers dimension model
    columns: 
      - name: customer_id
        description: The primary key for customers.
        tests:
          - unique
          - not_null
  - name: fct_orders
    description: orders fact model
    columns:
      - name: order_id
        description: the primary key for orders
        tests:
          - unique
          - not_null

exposures:
  - name: orders_data
    label: orders_data
    type: notebook
    maturity: high
    url: https://tinyurl.com/jaffle-shop-reporting
    description: 'Exposure for orders data'
    depends_on:
      - ref('fct_orders')
    owner:
      name: Michael McData
      email: data@jaffleshop.com

  - name: customers_data
    type: notebook
    url: https://tinyurl.com/jaffle-shop-reporting
    description: 'Exposure for customers data'
    owner:
      name: Michael McData
      email: data@jaffleshop.com
    depends_on:
      - ref('fct_orders')
